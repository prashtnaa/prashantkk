<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>For Kusu 💗</title>
<style>
  :root{
    --pink:#ff8fbd;
    --deep:#17131a;
    --text:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{min-height:100vh;overflow:hidden}
  body.landscape-hint{background:#000}
  #rotateHint{
    position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
    background:#000;color:#fff;text-align:center;padding:30px;font-weight:800;font-size:clamp(20px,4vw,34px);
  }
  #rotateHint .hintBox{max-width:700px}
  #rotateHint .icon{font-size:64px;margin-bottom:18px}
  @media (orientation:portrait){
    #rotateHint{display:flex}
    #phone{display:none}
  }
  #phone{
    width:100%;
    min-height:100vh;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
  }
  .screen{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    opacity:0;pointer-events:none;
    transition:opacity .45s ease;
  }
  .screen.active{opacity:1;pointer-events:auto}
  .photo .content{align-items:flex-start;justify-content:center}
  .photo .message,.photo .buttons{position:relative;z-index:2}
  .photo .message{max-width:560px;text-align:left;background:rgba(0,0,0,.38);backdrop-filter:blur(3px);padding:18px 20px;border-radius:18px}
  .photo .buttons{justify-content:flex-start;margin-left:20px}
  .photo{
    background:#000;
    background-image:url("q1.jpeg");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
  }
  .pink{background:linear-gradient(145deg,#ffd2e4,#ff91bd 55%,#f76ca8)}
  .dark{background:radial-gradient(circle at 50% 25%,#332b38,#0a090b 72%)}
  .white{background:#fff;color:#201a20}
  .white .message{color:#201a20}
  .white .buttons button{color:#fff;background:#201a20}
  .white .buttons button.alt{color:#201a20;background:#fff;border:1px solid #201a20}
  .black{background:#000}
  .message{
    width:min(760px,88%);
    text-align:center;
    font-weight:700;
    font-size:clamp(19px,5vw,25px);
    line-height:1.28;
    text-shadow:0 2px 8px rgba(0,0,0,.35);
    animation:pop .45s ease both;
  }
  .white .message{text-shadow:none}
  .buttons{margin-top:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  button{
    appearance:none;border:0;cursor:pointer;
    min-height:48px;padding:11px 22px;border-radius:999px;
    background:rgba(255,255,255,.94);color:#d44982;
    font-weight:800;font-size:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  button:active{transform:scale(.96)}
  button.alt{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.45)}
  .white button{background:#201a20;color:#fff}
  .content{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:100%;padding:clamp(24px,5vw,60px)}
  .videoScreen{background:#000}
  video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .videoOverlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.42);color:#fff;font-weight:800;font-size:clamp(20px,4vw,34px);
    pointer-events:none;opacity:0;transition:opacity .2s;text-align:center;
  }
  .countdownNumber{font-size:clamp(90px,16vw,180px);font-weight:1000;line-height:.9;text-shadow:0 8px 28px rgba(0,0,0,.65)}
  .countdownLabel{margin-top:18px;letter-spacing:.04em}
  .videoScreen video{image-rendering:auto}

  .videoOverlay.show{opacity:1}
  .countdown{
    font-size:72px;font-weight:900;line-height:1;
    margin-top:18px;text-shadow:0 5px 18px rgba(0,0,0,.25);
  }
  .small{font-size:14px;opacity:.85;margin-top:10px}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

</style>
</head>
<body>
<div id="rotateHint" role="status" aria-live="polite">
  <div class="hintBox">
    <div class="icon">↔️</div>
    Please turn your device sideways to landscape mode for the full experience 💗
  </div>
</div>
<main id="phone" aria-live="polite"></main>

<script>
(() => {
  const root = document.getElementById('phone');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function makeScreen(cls, html) {
    const el = document.createElement('section');
    el.className = 'screen ' + cls;
    el.innerHTML = html;
    root.appendChild(el);
    return el;
  }

  function show(el) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  function messageScreen(cls, text, buttons) {
    const el = makeScreen(cls, `<div class="content"><div class="message">${text}</div><div class="buttons"></div></div>`);
    const box = el.querySelector('.buttons');
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      if (b.alt) btn.classList.add('alt');
      btn.addEventListener('click', b.action);
      box.appendChild(btn);
    });
    return el;
  }

  function videoScreen(file) {
    const el = makeScreen('videoScreen',
      `<video playsinline preload="auto"></video><div class="videoOverlay"></div>`);
    const v = el.querySelector('video');
    v.src = file;
    v.preload = 'auto';
    v.setAttribute('playsinline', '');
    v.setAttribute('disablePictureInPicture', 'true');
    return {el, v};
  }

  async function playAfter(videoObj, seconds, afterEnd) {
    show(videoObj.el);
    const overlay = videoObj.el.querySelector('.videoOverlay');
    overlay.innerHTML = '<div class="countdownNumber"></div><div class="countdownLabel">GET READY...</div>';
    overlay.classList.add('show');

    // Proper visible countdown before every video.
    for (let i = seconds; i >= 1; i--) {
      overlay.querySelector('.countdownNumber').textContent = i;
      overlay.querySelector('.countdownLabel').textContent = 'GET READY...';
      await wait(1000);
    }
    overlay.querySelector('.countdownNumber').textContent = '▶';
    overlay.querySelector('.countdownLabel').textContent = 'HERE WE GO';
    await wait(350);
    overlay.classList.remove('show');

    try {
      await videoObj.v.play();
    } catch (e) {
      overlay.innerHTML = '<div class="countdownLabel">Tap to play</div>';
      overlay.classList.add('show');
      const resume = () => {
        overlay.classList.remove('show');
        videoObj.v.play().catch(()=>{});
        videoObj.v.removeEventListener('click', resume);
      };
      videoObj.v.addEventListener('click', resume);
      return;
    }
    videoObj.v.onended = async () => {
      videoObj.v.pause();
      if (afterEnd) await afterEnd();
    };
  }

  // Ask the browser for landscape when the API and permission model allow it.
  async function requestLandscape() {
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
      }
    } catch (e) {
      // Browser may require fullscreen/user gesture; the portrait hint remains.
    }
  }
  document.addEventListener('click', requestLandscape, {once:true});

  // 1 — opening
  const intro = messageScreen('photo',
    'HEY, its me Prashant again , here to annoy dear kusu......',
    [{label:'HELLO', action:() => {
      const s = messageScreen('photo',
        'Actually , i found a video that I think is can be us hehe, wanna see?',
        [{label:'YES', action:() => step2()}]);
      show(s);
    }}]
  );
  show(intro);

  async function step2(){
    const vid = videoScreen('q2.mp4');
    await playAfter(vid, 3, async () => {
      const s = messageScreen('pink',
        'That was so cute haiiii wowow , maybe us hehe',
        [
          {label:'Umm ta ni', action:step3},
          {label:'Bhak sala', action:step3}
        ]);
      show(s);
    });
  }

  async function step3(){
    const s = messageScreen('pink',
      'Actually , kusu i wrote a little something with dramatic effects , wanna see ?',
      [{label:'YES', action:async() => {
        const vid = videoScreen('q3.mp4');
        await playAfter(vid, 3, async () => {
          vid.v.pause();
          await wait(5000);
          const next = messageScreen('pink',
            'hehe , prashant stupid lol, oh noooo ,hehe',
            [{label:'Wanna proceed ?', action:step4}]);
          show(next);
        });
      }}]);
    show(s);
  }

  async function step4(){
    const s = messageScreen('dark',
      'Actually i have a Bob Dylan video wanna see? , We both love him right......',
      [
        {label:'YES', action:step4play},
        {label:'ABSOLUTELYYYYYYY', action:step4play}
      ]);
    show(s);
  }

  async function step4play(){
    const vid = videoScreen('q4.mp4');
    await playAfter(vid, 3, async() => {
      const s = messageScreen('dark',
        'God , he is so cool uff i am dying',
        [{label:'umm ta ni', action:step5}]);
      show(s);
    });
  }

  async function step5(){
    const s = messageScreen('dark',
      'HEY DO YOU WANNA MAKE A WISH THEN I WILL SHOW YOU WHAT MY ULTIMATE WISH IS I SWEAR',
      [{label:'OK', action:async() => {
        const vid = videoScreen('q5.mp4');
        await playAfter(vid, 3, async() => {
          const end = messageScreen('dark',
            'There may my luck be with you too',
            [{label:'ALRIGHT', action:step6}]);
          show(end);
        });
      }}]);
    show(s);
  }

  async function step6(){
    const s = messageScreen('pink',
      'HEY , actually do you wanna know what i dream of most these days , actually this is something i so wish',
      [
        {label:'Yes, i wanna know', action:step6play},
        {label:'Fuck off , I dont care', action:() => {
          const t = messageScreen('pink',
            'Aama , kusu ta heartless , but thats what i love about you hehe',
            [{label:'Continue', action:step6play}]);
          show(t);
        }}
      ]);
    show(s);
  }

  async function step6play(){
    const countdown = makeScreen('pink',
      `<div class="content"><div class="message">AHH, waitoooooo</div><div class="countdown">5</div><div class="small">something is coming...</div></div>`);
    show(countdown);
    const n = countdown.querySelector('.countdown');
    for(let i=5;i>=1;i--){ n.textContent=i; await wait(1000); }
    n.textContent='♡';
    await wait(250);
    const vid = videoScreen('q6.mp4');
    await playAfter(vid, 0, async() => {
      await wait(3000);
      const s = messageScreen('black',
        'WELL , THAT WAS MY ONLY DREAM AS FOR NOW HEHEE, FAQQQQQ  ;-; , BLEHHHHHH , but i am honest lahh',
        [
          {label:'Thanks', action:step8},
          {label:'EISH', action:step8}
        ]);
      show(s);
    });
  }

  async function step8(){
    const s = messageScreen('white',
      'HEY , wanna see a timothee ending hehe',
      [{label:'YES', action:async() => {
        const vid = videoScreen('q7.mp4');
        await playAfter(vid, 0, async() => {
          vid.v.pause();
          await wait(5000);
          const end = messageScreen('white',
            'Hey kusu , i know you have been busy lately and its absolutely ok bujyauuuuu, so study eti dherai aani i am always there for you , you are the best in world remember alright , my everything hehe',
            []);
          show(end);
        });
      }}]);
    show(s);
  }
})();
</script>
</body>
</html>
